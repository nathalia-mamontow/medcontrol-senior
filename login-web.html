<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedControl Sênior - Entrar</title>
  <meta name="description" content="Entre no MedControl Sênior como paciente idoso ou como cuidador/familiar para acompanhar medicamentos, horários e alertas de saúde com segurança.">
  <style>
/* ===== Variáveis de cor (fácil de trocar) ===== */
:root {
  --azul: #2f5fe3;
  --azul-forte: #1d4ed8;
  --azul-escuro-texto: #1e3a8a;
  --escuro: #1e293b;
  --texto: #1e293b;
  --texto-suave: #475569;
  --fundo: #f8f9fc;
  --branco: #ffffff;
  --borda: #dde3ee;
  --verde: #047857;
  --amarelo: #fbbf24;
  --vermelho: #be123c;
}

/* ===== Base ===== */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--texto);
  background: var(--fundo);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

/* Ícones em linha (herdam a cor do texto) */
.icone {
  width: 1.25em;
  height: 1.25em;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Foco bem visível para quem usa teclado */
a:focus-visible,
button:focus-visible {
  outline: 4px solid #000;
  outline-offset: 3px;
}

/* Texto só para leitores de tela */
.so-leitor {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Link "pular para o conteúdo" */
.pular-conteudo {
  position: absolute;
  left: 8px;
  top: -60px;
  background: var(--amarelo);
  color: #000;
  padding: 10px 16px;
  font-weight: 700;
  z-index: 10;
}
.pular-conteudo:focus { top: 8px; }

/* ===== Cabeçalho ===== */
.topo {
  background: var(--fundo);
  border-bottom: 4px solid var(--borda);
  padding-bottom: 20px;
}
.topo-interno,
.menu,
main {
  max-width: 1400px;
  margin-left: auto;
  margin-right: auto;
}
.topo-interno {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
}
.marca { display: flex; align-items: center; gap: 14px; }
.marca-icone {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: #3b5bdb;
  border: 3px solid #2f48c4;
  color: #fff;
  box-shadow: 0 4px 6px rgba(30, 41, 59, 0.25);
}
.marca h1 { font-size: 1.6rem; text-transform: uppercase; line-height: 1.1; }
.marca-sub { font-size: 1rem; color: var(--texto-suave); }

.topo-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

.paciente {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 28px 8px 12px;
  background: var(--branco);
  border: 3px solid var(--borda);
  border-radius: 999px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #cbd5e1;
  color: var(--texto-suave);
  font-weight: 800;
}
.paciente-nome { font-weight: 700; line-height: 1.2; }
.paciente-idade { font-size: 0.95rem; color: var(--texto-suave); }

.botao-letra,
.botao-sair {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-weight: 800;
  min-height: 48px;
  padding: 8px 22px;
  border-radius: 999px;
  cursor: pointer;
}
.botao-letra {
  text-transform: uppercase;
  font-size: 0.95rem;
  border: 3px solid #b6c6ea;
  background: #e3eaf8;
  color: var(--azul-escuro-texto);
}
.botao-sair {
  border: 3px solid var(--borda);
  background: var(--branco);
  color: var(--texto);
}

/* ===== Menu de navegação (padrão = vertical, para o mobile) ===== */
.menu {
  margin: 0 16px;
  background: var(--branco);
  border: 3px solid var(--borda);
  border-radius: 28px;
  padding: 20px 14px;
}
.menu-titulo {
  padding: 0 12px 10px;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.menu li + li { margin-top: 6px; }
.menu a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 16px;
  color: var(--texto-suave);
  font-weight: 700;
  text-decoration: none;
}
.menu a:hover { background: #eef2ff; }
.menu a[aria-current="page"] {
  background: var(--escuro);
  color: #fff;
  box-shadow: 0 3px 0 #000;
}

/* ===== Conteúdo principal ===== */
main {
  flex: 1 0 auto;
  width: 100%;
  display: grid;
  gap: 24px;
  padding: 28px 16px 40px;
}

.cartao {
  background: var(--branco);
  border: 3px solid var(--borda);
  border-radius: 28px;
  padding: 20px;
}

/* ===== Botões comuns ===== */
.botao {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-weight: 700;
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 10px 22px;
  min-height: 48px;           /* área mínima de toque */
  cursor: pointer;
}
.botao-azul   { background: var(--azul); box-shadow: 0 4px 0 #1e3a8a; }
.botao-escuro { background: var(--escuro); box-shadow: 0 4px 0 #000; }

/* ===== Assistente de voz ===== */
.assistente {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
}
.assistente-icone {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border: 2px solid var(--texto-suave);
  border-radius: 14px;
  font-size: 1.5rem;
}
.assistente-texto { flex: 1 1 280px; }
.assistente h3 { font-size: 1.25rem; }
.assistente-texto p { color: var(--texto-suave); font-weight: 600; }
.comando {
  font-family: Consolas, monospace;
  font-weight: 700;
  color: var(--azul-forte);
  background: #eef2ff;
  padding: 0 8px;
  border-radius: 6px;
}
.assistente-botoes { display: flex; gap: 12px; }

/* ===== Próximo medicamento (cartão azul) ===== */
.proximo {
  padding: 36px 40px;
  color: #fff;
  background: var(--azul);
  border: 5px solid var(--azul-forte);
  border-radius: 40px;
  box-shadow: 0 16px 40px rgba(37, 99, 235, 0.25);
}
.proximo-topo {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.pilula {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.22);   /* fundo escuro garante contraste do texto branco */
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.pilula-hora,
.pilula-dose {
  font-size: 1.5rem;
  letter-spacing: 0;
  text-transform: none;
  border-radius: 14px;
}

.remedio-nome {
  margin-top: 20px;
  font-size: clamp(2.4rem, 7vw, 4.5rem);
  font-weight: 800;
  line-height: 1.1;
}
.remedio-dose { margin-top: 8px; font-size: 1.6rem; font-weight: 600; }

.acoes-grandes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 28px;
}
.botao-grande {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font: inherit;
  font-size: 1.2rem;
  font-weight: 800;
  color: #fff;
  min-height: 90px;
  padding: 14px 12px;
  border: 0;
  border-radius: 22px;
  cursor: pointer;
}
.botao-grande.verde    { background: var(--verde);    box-shadow: 0 6px 0 #064e3b; }
.botao-grande.amarelo  { background: var(--amarelo);  box-shadow: 0 6px 0 #b45309; color: #000; }
.botao-grande.vermelho { background: var(--vermelho); box-shadow: 0 6px 0 #881337; }

/* ===== Três colunas (mesma altura) ===== */
.colunas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  align-items: stretch;   /* os 3 boxes ficam com a mesma altura */
}
.coluna-titulo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--borda);
}
.coluna-titulo h3 { font-size: 1.2rem; }

.etiqueta {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 2px 12px;
  border-radius: 999px;
  background: #e0e7ff;
  color: var(--azul-escuro-texto);
}
.etiqueta-verde   { background: #d6f2e0; color: #14532d; }
.etiqueta-amarela { background: #fdebb0; color: #6b4300; }

.lista { display: grid; gap: 10px; }
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border: 2px solid var(--borda);
  border-radius: 16px;
}
.item-nome { font-weight: 700; }
.item-info { font-size: 0.9rem; color: var(--texto-suave); }
.item-tomado { background: #effaf3; border-color: #bfe8cd; }
.selo-ok { font-size: 1.4rem; }

.alerta {
  background: #fdecee;
  border: 2px solid #f1a9b2;
  border-radius: 16px;
  padding: 14px;
  color: #7f1020;
}
.alerta h4 { font-size: 1rem; margin-bottom: 6px; }
.alerta p { font-size: 0.95rem; }

/* ===== Rodapé ===== */
.rodape {
  background: var(--branco);
  border-top: 4px solid #4b5563;
  padding: 28px 24px;
  text-align: center;
}
.rodape p {
  max-width: 1400px;
  margin: 0 auto;
  font-weight: 700;
  color: var(--texto-suave);   /* contraste alto sobre fundo branco */
}

/* ===== Página de Medicamentos ===== */
.botao-preto { background: #0f172a; box-shadow: 0 4px 0 #000; }
.botao-grande-texto { font-size: 1.15rem; padding: 14px 28px; border-radius: 999px; }

.secao-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-top: 8px;
}
.secao-texto { flex: 1 1 380px; }
.secao-texto h2 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
.secao-texto p { margin-top: 8px; font-weight: 600; color: var(--texto-suave); max-width: 60ch; }
.secao-botoes { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }

.med-lista {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  align-items: stretch;      /* cartões da mesma linha com a mesma altura */
}
.med-lista > li { display: flex; }

.med-card {
  width: 100%;
  background: var(--branco);
  border: 4px solid var(--borda);
  border-radius: 40px;
  padding: 28px;
}
.med-card-alerta { background: #faf8f8; border-color: #dc2626; }

.med-topo { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 3px solid var(--borda); }
.med-icone {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 60px;
  height: 60px;
  border: 2px solid var(--borda);
  border-radius: 18px;
  background: #f8f9fc;
  color: var(--azul-forte);
}
.med-icone .icone { width: 30px; height: 30px; }
.med-titulo { flex: 1; min-width: 0; }
.med-titulo h3 { font-size: 1.6rem; line-height: 1.2; }
.med-ativo { font-style: italic; font-weight: 600; color: var(--texto-suave); }
.med-selos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.selo {
  font-size: 0.85rem;
  font-weight: 700;
  padding: 2px 12px;
  border-radius: 999px;
  background: #e5e9f0;
  color: var(--texto-suave);
}
.selo-quem { background: var(--branco); border: 2px solid var(--borda); color: var(--azul-escuro-texto); }

.botao-lixeira {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--texto-suave);
  cursor: pointer;
}
.botao-lixeira:hover { background: #fdecee; color: var(--vermelho); }

.med-alerta {
  margin-top: 16px;
  padding: 14px 18px;
  border: 3px solid #f4b6c0;
  border-radius: 20px;
  background: #fdf0f2;
  color: #7f1020;
  font-weight: 700;
}

.rotulo {
  margin: 0;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.med-dados {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 16px 0 0;
}
.med-dados > div,
.med-bloco {
  padding: 14px 20px;
  border: 3px solid var(--borda);
  border-radius: 24px;
  background: #f8f9fc;
}
.med-dados dd { margin: 4px 0 0; font-size: 1.15rem; font-weight: 800; }
.med-bloco { margin-top: 16px; }
.horarios { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.horarios li {
  padding: 4px 20px;
  border-radius: 999px;
  background: var(--branco);
  border: 2px solid var(--borda);
  box-shadow: 0 2px 4px rgba(30, 41, 59, 0.12);
  font-weight: 800;
}
.faixa {
  margin-top: 16px;
  padding: 12px 18px;
  border: 3px solid var(--borda);
  border-radius: 20px;
  background: #f8f9fc;
}

/* ===== Tablet / mobile ===== */
@media (max-width: 1000px) {
  .colunas { grid-template-columns: 1fr; }
  .med-lista { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .med-card { padding: 20px 16px; border-radius: 28px; }
  .med-dados { grid-template-columns: 1fr; }
  .secao-botoes { width: 100%; }
  .secao-botoes .botao { width: 100%; justify-content: center; }
  .acoes-grandes { grid-template-columns: 1fr; }
  .proximo { padding: 24px 20px; }
}

/* ===== Desktop: menu na horizontal ===== */
@media (min-width: 1100px) {
  .menu {
    margin: 0 auto;
    width: calc(100% - 48px);
    max-width: 1352px;
    padding: 14px 16px;
    border-radius: 36px;
  }
  /* o título continua existindo para leitores de tela, mas some da tela */
  .menu-titulo {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .menu ul {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .menu li { flex: 1 1 auto; }
  .menu li + li { margin-top: 0; }
  .menu a {
    justify-content: center;
    padding: 14px 18px;
    border: 3px solid var(--borda);
    border-radius: 999px;
    color: var(--texto);
    white-space: nowrap;
  }
  .menu a[aria-current="page"] { border-color: var(--escuro); }

  main { padding: 36px 24px 48px; }
}

/* =====================================================
   Modo "Letra grande (Sênior)"
   Ativado pelo botão do cabeçalho (classe modo-senior no <html>).
   Vale para todas as páginas que usam este style.css.
   ===================================================== */
html.modo-senior {
  font-size: 125%;              /* tudo em rem aumenta 25% */
  --texto: #0f172a;
  --texto-suave: #334155;       /* textos secundários mais escuros */
}
.modo-senior body { line-height: 1.6; }

/* Cabeçalho escuro com detalhes amarelos */
.modo-senior .topo { background: #111827; border-bottom-color: #111827; }
.modo-senior .marca h1 { color: #fff; }
.modo-senior .marca-sub { color: #e2e8f0; }
.modo-senior .marca-icone { background: #f5bd1f; border-color: #e0a60a; color: #111827; }
.modo-senior .botao-letra {
  background: #f5bd1f;
  border-color: #f5bd1f;
  color: #111827;
  box-shadow: 0 4px 0 #b45309;
}
.modo-senior .botao-sair { background: #1e293b; border-color: #475569; color: #fff; }
.modo-senior .topo a:focus-visible,
.modo-senior .topo button:focus-visible { outline-color: #fff; }   /* foco visível no fundo escuro */

/* Menu escuro; página atual em amarelo */
.modo-senior .menu { background: #1a2233; border-color: #334155; }
.modo-senior .menu-titulo { color: #cbd5e1; }
.modo-senior .menu a { color: #fff; border-color: #334155; }
.modo-senior .menu a:hover { background: #27324a; }
.modo-senior .menu a[aria-current="page"] {
  background: #f5bd1f;
  border-color: #f5bd1f;
  color: #111827;
  box-shadow: 0 3px 0 #b45309;
}

/* Cartões em tom creme com borda amarela */
.modo-senior .assistente { background: #fdf9e8; border-color: #f3d36b; }
.modo-senior .assistente h3 { color: #3b1d00; }
.modo-senior .assistente-icone { background: #fff; border-color: #334155; }
.modo-senior .comando { background: #fff; }

.modo-senior .proximo {
  background: #fbf5da;
  border-color: #f3d36b;
  color: #3b1d00;
  box-shadow: 0 12px 30px rgba(245, 189, 31, 0.2);
}
.modo-senior .pilula-titulo { background: transparent; color: #7a3f00; padding-left: 0; }
.modo-senior .pilula-hora,
.modo-senior .pilula-dose { background: #fbe7a1; color: #2b1600; }

/* Botões maiores, mais fáceis de tocar */
.modo-senior .botao { min-height: 56px; }
.modo-senior .botao-grande { min-height: 110px; }
.modo-senior .botao-lixeira { width: 56px; height: 56px; }

/* Com letra grande, listas em uma coluna cabem melhor */
@media (max-width: 1300px) {
  .modo-senior .colunas,
  .modo-senior .med-lista { grid-template-columns: 1fr; }
}

/* ===== Página de Calendário ===== */
.cal-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.cal-card,
.cal-detalhes {
  background: var(--branco);
  border: 4px solid var(--borda);
  border-radius: 40px;
  padding: 32px;
}
.cal-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 3px solid var(--borda);
}
.cal-mes {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 22px;
  border: 3px solid var(--borda);
  border-radius: 999px;
  background: #f8f9fc;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.cal-nav { display: flex; gap: 12px; }
.cal-nav button {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border: 3px solid var(--borda);
  border-radius: 16px;
  background: var(--branco);
  color: var(--texto);
  cursor: pointer;
}
.cal-nav button:disabled { opacity: 0.45; cursor: not-allowed; }

.cal-tabela {
  width: 100%;
  margin-top: 8px;
  border-collapse: separate;
  border-spacing: 10px;
  table-layout: fixed;
}
.cal-tabela th {
  padding: 8px 0;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.cal-tabela abbr { text-decoration: none; }
.cal-tabela td { padding: 0; }

.cal-dia {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  min-height: 96px;
  padding: 10px 4px 12px;
  border: 3px solid var(--borda);
  border-radius: 24px;
  background: #f8f9fc;
  color: var(--texto);
  font: inherit;
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
}
.cal-dia:hover { background: #eef2ff; }
.cal-dia:focus-visible { outline: 4px solid #000; outline-offset: 3px; }
.cal-dia[aria-pressed="true"] {
  background: var(--azul);
  border-color: var(--azul-forte);
  color: #fff;
  box-shadow: 0 5px 0 #1e3a8a;
}
.pontos { display: flex; gap: 6px; margin-top: auto; min-height: 14px; }
.ponto {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid;
  border-radius: 50%;
}
.ponto-tomado     { background: #22c55e; border-color: #15803d; }
.ponto-atrasado   { background: #fbbf24; border-color: #b45309; }
.ponto-nao-tomado { background: #f43f5e; border-color: #be123c; }

.legenda {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px 32px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 3px solid var(--borda);
  font-weight: 700;
}
.legenda li { display: flex; align-items: center; gap: 10px; }

/* Detalhes do dia */
.detalhes-topo { padding-bottom: 16px; border-bottom: 3px solid var(--borda); }
.detalhes-topo h3 {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--azul-forte);
}
.detalhes-topo p { margin-top: 4px; font-weight: 600; color: var(--texto-suave); }
.doses { display: grid; gap: 16px; margin-top: 20px; }
.dose {
  padding: 16px 20px;
  border: 3px solid var(--borda);
  border-radius: 28px;
  background: #f8f9fc;
}
.dose-vazia { font-weight: 600; color: var(--texto-suave); }
.dose-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dose-nome { font-size: 1.1rem; font-weight: 800; }
.estado {
  flex-shrink: 0;
  padding: 2px 14px;
  border: 2px solid var(--borda);
  border-radius: 999px;
  background: var(--branco);
  color: var(--texto-suave);
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.estado-tomado     { background: #dcfce7; border-color: #86efac; color: #14532d; }
.estado-atrasado   { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
.estado-nao-tomado { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
.dose-info {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-weight: 700;
  color: var(--texto-suave);
}
.dose-confirmacao {
  margin-top: 12px;
  padding: 10px 16px;
  border: 2px solid var(--borda);
  border-radius: 20px;
  background: var(--branco);
  font-weight: 600;
  color: var(--texto-suave);
}
.cal-nota {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 3px solid var(--borda);
  font-weight: 700;
  color: var(--texto-suave);
}

@media (max-width: 1000px) {
  .cal-layout { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .cal-card, .cal-detalhes { padding: 20px 14px; border-radius: 28px; }
  .cal-tabela { border-spacing: 4px; }
  .cal-tabela th { font-size: 0.7rem; }
  .cal-dia { min-height: 64px; border-radius: 14px; font-size: 1rem; }
  .ponto { width: 10px; height: 10px; }
  .pontos { gap: 3px; }
}

/* Modo letra grande */
.modo-senior .cal-dia { min-height: 110px; }
@media (max-width: 1300px) {
  .modo-senior .cal-layout { grid-template-columns: 1fr; }
}

/* Letra grande: menu horizontal sempre em UMA linha (desktop) */
@media (min-width: 1100px) {
  .modo-senior .menu ul { flex-wrap: nowrap; gap: 8px; }
  .modo-senior .menu li { min-width: 0; }
  .modo-senior .menu a {
    gap: 8px;
    padding: 12px 10px;
    font-size: 0.85rem;        /* um pouco menor que o resto para caber os 7 itens */
    line-height: 1.25;
    text-align: center;
    white-space: normal;       /* se faltar espaço, o texto quebra dentro do botão e nenhum item cai de linha */
  }
}

/* ===== Botão Sair (agora é um link para o login) ===== */
a.botao-sair { text-decoration: none; }

/* ===== Página de Login ===== */
.login-main { place-items: center; align-content: center; padding: 32px 16px 48px; }
.login-card {
  width: 100%;
  max-width: 560px;
  overflow: hidden;
  background: var(--branco);
  border: 4px solid var(--borda);
  border-radius: 48px;
}
.login-topo {
  padding: 40px 24px 48px;
  text-align: center;
  color: #fff;
  background: var(--azul);
  border-bottom: 6px solid var(--azul-forte);
  border-radius: 0 0 56px 56px;
  box-shadow: 0 20px 40px rgba(47, 95, 227, 0.25);
}
.login-logo {
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  margin: 0 auto 16px;
  border-radius: 22px;
  background: #fff;
  color: var(--azul);
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.25);
}
.login-topo h1 { font-size: 2rem; text-transform: uppercase; line-height: 1.15; }
.login-topo p { margin: 12px auto 0; max-width: 34ch; font-size: 1.1rem; font-weight: 600; line-height: 1.5; }

.login-form { padding: 36px 40px 44px; }
.perfil { margin: 0; padding: 0; border: 0; min-width: 0; }
.perfil legend {
  width: 100%;
  margin-bottom: 18px;
  padding: 0;
  text-align: center;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.perfil-opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.perfil-opcao { position: relative; display: block; cursor: pointer; }
.perfil-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  height: 100%;
  padding: 22px 10px;
  border: 4px solid var(--borda);
  border-radius: 28px;
  background: #f8f9fc;
  color: var(--texto-suave);
  text-align: center;
  font-size: 0.95rem;
  font-weight: 800;
  text-transform: uppercase;
}
.perfil-emoji { font-size: 2rem; line-height: 1; }
.perfil-opcao input:checked + .perfil-card {
  border-color: var(--azul);
  background: var(--branco);
  color: var(--texto);
}
.perfil-opcao input:focus-visible + .perfil-card { outline: 4px solid #000; outline-offset: 3px; }

.campo { margin-top: 28px; }
.campo label {
  display: block;
  margin-bottom: 10px;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.campo-caixa { position: relative; }
.campo-caixa .icone {
  position: absolute;
  left: 20px;
  top: 50%;
  width: 28px;
  height: 28px;
  transform: translateY(-50%);
  color: #64748b;
  pointer-events: none;
}
.campo-caixa input {
  width: 100%;
  height: 64px;
  padding: 0 20px 0 64px;
  border: 3px solid var(--borda);
  border-radius: 22px;
  background: #f8f9fc;
  color: var(--texto);
  font: inherit;
  font-size: 1.15rem;
  font-weight: 700;
}
.campo-caixa input:focus-visible { border-color: var(--azul); outline: 4px solid #000; outline-offset: 3px; }

.botao-entrar,
.botao-conta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  border-radius: 22px;
  font: inherit;
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
}
.botao-entrar {
  margin-top: 36px;
  border: 0;
  background: var(--azul);
  color: #fff;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  box-shadow: 0 6px 0 #1e3a8a;
}
.login-ou {
  margin: 28px 0 16px;
  text-align: center;
  font-size: 1rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.botao-conta { border: 3px solid var(--borda); background: var(--branco); color: var(--texto); }
.botao-entrar:focus-visible,
.botao-conta:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

@media (max-width: 700px) {
  .login-card { border-radius: 32px; }
  .login-form { padding: 28px 20px 32px; }
  .login-topo h1 { font-size: 1.6rem; }
}

/* ===== Página de Histórico ===== */
.botao-perigo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 10px 22px;
  border: 2px solid #fca5a5;
  border-radius: 16px;
  background: var(--branco);
  color: #be123c;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.botao-perigo:hover { background: #fff1f2; }
.botao-perigo:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

.filtros {
  padding: 28px 32px 32px;
  background: var(--branco);
  border: 4px solid var(--borda);
  border-radius: 36px;
}
.filtros h3 {
  margin-bottom: 18px;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.filtros-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.filtro label { display: block; margin-bottom: 10px; font-weight: 800; }
.filtro-caixa { position: relative; }
.filtro-caixa .icone {
  position: absolute;
  left: 18px;
  top: 50%;
  width: 24px;
  height: 24px;
  transform: translateY(-50%);
  color: #64748b;
  pointer-events: none;
}
.filtro input,
.filtro select {
  width: 100%;
  height: 56px;
  padding: 0 18px;
  border: 3px solid var(--borda);
  border-radius: 20px;
  background: #f8f9fc;
  color: var(--texto);
  font: inherit;
  font-weight: 700;
}
.filtro input.com-icone { padding-left: 54px; }
.filtro input:focus-visible,
.filtro select:focus-visible { border-color: var(--azul); outline: 4px solid #000; outline-offset: 3px; }

.contagem { margin-bottom: 12px; font-weight: 700; color: var(--texto-suave); }
.tabela-rolagem {
  overflow-x: auto;
  background: var(--branco);
  border: 3px solid var(--borda);
  border-radius: 36px;
  box-shadow: 0 6px 16px rgba(30, 41, 59, 0.08);
}
.tabela-rolagem:focus-visible { outline: 4px solid #000; outline-offset: 3px; }
.tabela-hist { width: 100%; min-width: 960px; border-collapse: collapse; }
.tabela-hist thead { background: #e6eaf2; }
.tabela-hist th {
  padding: 22px 20px;
  text-align: left;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.tabela-hist td {
  padding: 22px 20px;
  border-top: 2px solid #e8ecf3;
  font-weight: 700;
}
.tabela-hist .centro { text-align: center; }
.hist-data {
  font-family: Consolas, monospace;
  font-weight: 800;
  color: var(--azul-forte);
}
.hist-hora { display: inline-flex; align-items: center; gap: 6px; }
.hist-nome { font-size: 1.1rem; font-weight: 800; }
.tabela-hist .botao-lixeira { margin: 0 auto; }
.tabela-hist .vazio { padding: 32px 20px; text-align: center; color: var(--texto-suave); }

.situacao {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border: 2px solid;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
  white-space: nowrap;
}
.situacao-no-horario { background: #dcfce7; border-color: #86efac; color: #14532d; }
.situacao-atrasado   { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
.situacao-nao-tomado { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }

@media (max-width: 1000px) {
  .filtros-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .filtros { padding: 22px 16px 24px; border-radius: 28px; }
  .filtros-grid { grid-template-columns: 1fr; gap: 18px; }
  .tabela-rolagem { border-radius: 24px; }
}
@media (max-width: 1300px) {
  .modo-senior .filtros-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ===== Formulário "Novo medicamento" ===== */
.form-novo {
  padding: 40px;
  background: var(--branco);
  border: 4px solid var(--borda);
  border-radius: 48px;
}
.form-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 3px solid var(--borda);
}
.form-topo h3 { font-size: 1.8rem; line-height: 1.2; }
.form-topo p { margin-top: 6px; font-weight: 600; color: var(--texto-suave); }
.selo-verde {
  padding: 6px 18px;
  border: 2px solid #86efac;
  border-radius: 999px;
  background: #dcfce7;
  color: #14532d;
  font-family: Consolas, monospace;
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.quem {
  margin: 32px 0 0;
  padding: 24px 28px 28px;
  min-width: 0;
  border: 3px solid var(--borda);
  border-radius: 32px;
}
.quem legend {
  padding: 0 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.quem-opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.quem-opcao { position: relative; display: block; cursor: pointer; }
.quem-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  min-height: 72px;
  padding: 14px 16px;
  border: 3px solid var(--borda);
  border-radius: 22px;
  background: var(--branco);
  color: var(--texto-suave);
  text-align: center;
  font-weight: 800;
}
.quem-opcao input:checked + .quem-card { border-color: var(--azul); color: var(--texto); }
.quem-opcao input:focus-visible + .quem-card { outline: 4px solid #000; outline-offset: 3px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 28px 40px;
  margin-top: 32px;
}
.form-largo { grid-column: 1 / -1; }
.form-campo label {
  display: block;
  margin-bottom: 10px;
  font-size: 0.95rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.form-campo input,
.form-campo select,
.form-campo textarea {
  width: 100%;
  padding: 0 22px;
  border: 3px solid var(--borda);
  border-radius: 22px;
  background: #f8f9fc;
  color: var(--texto);
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
}
.form-campo input,
.form-campo select { height: 60px; }
.form-campo textarea { min-height: 130px; padding: 16px 22px; resize: vertical; }
.form-campo input::placeholder,
.form-campo textarea::placeholder { color: #64748b; font-weight: 600; }
.form-campo select.secundario {
  height: 48px;
  margin-top: 12px;
  padding: 0 16px;
  border-radius: 14px;
  background: var(--branco);
  font-size: 0.95rem;
}
.form-campo input:focus-visible,
.form-campo select:focus-visible,
.form-campo textarea:focus-visible { border-color: var(--azul); outline: 4px solid #000; outline-offset: 3px; }

.form-rodape {
  display: flex;
  justify-content: flex-end;
  gap: 16px;
  margin-top: 36px;
  padding-top: 28px;
  border-top: 3px solid var(--borda);
}
.botao-cancelar,
.botao-cadastrar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 30px;
  border-radius: 18px;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
}
.botao-cancelar { border: 3px solid var(--borda); background: var(--branco); color: var(--texto-suave); }
.botao-cadastrar { border: 0; background: #15803d; color: #fff; box-shadow: 0 5px 0 #14532d; }
.botao-cancelar:focus-visible,
.botao-cadastrar:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

.aviso-ok {
  padding: 14px 20px;
  border: 3px solid #86efac;
  border-radius: 20px;
  background: #dcfce7;
  color: #14532d;
  font-weight: 800;
}

@media (max-width: 900px) {
  .form-novo { padding: 28px 20px; border-radius: 32px; }
  .form-grid { grid-template-columns: 1fr; gap: 22px; }
  .quem-opcoes { grid-template-columns: 1fr; }
  .quem { padding: 20px 16px 22px; }
}
@media (max-width: 600px) {
  .form-rodape { flex-direction: column-reverse; }
  .form-rodape button { width: 100%; }
}
@media (max-width: 1300px) {
  .modo-senior .form-grid { grid-template-columns: 1fr; }
}

/* ===== Página de Cuidadores e Médicos ===== */
.bloco-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}
.bloco-texto { flex: 1 1 380px; }
.bloco-texto h2 { font-size: clamp(1.7rem, 3.5vw, 2.2rem); line-height: 1.2; }
.bloco-texto p { margin-top: 6px; font-weight: 600; color: var(--texto-suave); }

.botao-vincular {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 28px;
  border: 0;
  border-radius: 18px;
  background: #1d4ed8;
  color: #fff;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.botao-medico { background: #2a7a6f; }
.botao-vincular:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

.pessoa-lista {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  margin-top: 28px;
}
.pessoa-lista > li { display: flex; }
.lista-vazia { margin-top: 20px; font-weight: 700; color: var(--texto-suave); }

.pessoa-card {
  width: 100%;
  padding: 28px;
  background: var(--branco);
  border: 3px solid var(--borda);
  border-radius: 40px;
}
.pessoa-medico { border-color: #cdeee4; }
.pessoa-topo {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--borda);
}
.pessoa-avatar { flex-shrink: 0; font-size: 2.2rem; line-height: 1.1; }
.pessoa-titulo { flex: 1; min-width: 0; }
.pessoa-titulo h3 { font-size: 1.3rem; line-height: 1.25; }
.pessoa-sub { margin-top: 2px; font-size: 0.9rem; font-weight: 700; color: var(--texto-suave); }
.pessoa-esp { color: #1f6b5e; }
.botao-remover {
  flex-shrink: 0;
  min-height: 44px;
  padding: 6px 14px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #be123c;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.botao-remover:hover { background: #fff1f2; }
.botao-remover:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

.pessoa-dados { display: grid; gap: 8px; padding: 16px 0; }
.pessoa-dados p { font-weight: 700; color: var(--texto-suave); }
.pessoa-dados strong { color: var(--texto); }

.permissoes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 16px;
  border-top: 2px solid var(--borda);
}
.perm {
  padding: 4px 14px;
  border: 2px solid;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.perm-visualiza { background: #eef2ff; border-color: #c7d2fe; color: #1e3a8a; }
.perm-alertas   { background: #fffbeb; border-color: #fcd34d; color: #78350f; }
.perm-gerencia  { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
.perm-historico { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }

.ligar {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 10px 22px;
  border-radius: 16px;
  background: #ecfdf5;
  color: #14532d;
  font-weight: 800;
  text-decoration: none;
}
.ligar:hover { background: #d1fae5; }
.ligar:focus-visible { outline: 4px solid #000; outline-offset: 3px; }

.divisor { width: 100%; margin: 8px 0; border: 0; border-top: 2px solid var(--borda); }

@media (max-width: 1000px) {

/* Letra grande (Sênior): guarda a escolha e vale para todas as páginas do site */
(function () {
  var CHAVE = 'medcontrol-letra-grande';
  var raiz = document.documentElement;

  function lerEscolha() {
    try { return localStorage.getItem(CHAVE) === '1'; } catch (e) { return false; }
  }
  function guardarEscolha(ativo) {
    try { localStorage.setItem(CHAVE, ativo ? '1' : '0'); } catch (e) {}
  }

  // Aplica logo no carregamento, antes de a página aparecer (evita "piscar")
  var ativo = lerEscolha();
  raiz.classList.toggle('modo-senior', ativo);

  function atualizarBotoes() {
    var textos = document.querySelectorAll('.botao-letra-texto');
    for (var i = 0; i < textos.length; i++) {
      textos[i].textContent = ativo ? 'Letra normal' : 'Letra grande (Sênior)';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Aviso para leitores de tela quando o modo muda
    var aviso = document.createElement('p');
    aviso.className = 'so-leitor';
    aviso.setAttribute('role', 'status');
    document.body.appendChild(aviso);

    atualizarBotoes();

    var botoes = document.querySelectorAll('.botao-letra');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        ativo = !ativo;
        raiz.classList.toggle('modo-senior', ativo);
        guardarEscolha(ativo);
        atualizarBotoes();
        aviso.textContent = ativo ? 'Modo letra grande ativado.' : 'Modo letra grande desativado.';
      });
    }
  });
})();

/* Perfil de acesso (Idoso ou Cuidador/Familiar): vem do login e aparece abaixo do logotipo */
(function () {
  var CHAVE_PERFIL = 'medcontrol-perfil';
  var ROTULOS = {
    idoso: 'Acesso Sênior (Paciente)',
    cuidador: 'Acesso Cuidador/Familiar'
  };

  // Ao chegar do login (index.html?perfil=cuidador), guarda a escolha
  try {
    var param = new URLSearchParams(window.location.search).get('perfil');
    if (param === 'idoso' || param === 'cuidador') {
      localStorage.setItem(CHAVE_PERFIL, param);
    }
  } catch (e) {}

  function lerPerfil() {
    try {
      var p = localStorage.getItem(CHAVE_PERFIL);
      return p === 'cuidador' ? 'cuidador' : 'idoso';
    } catch (e) { return 'idoso'; }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var textos = document.querySelectorAll('.marca-sub');
    for (var i = 0; i < textos.length; i++) {
      textos[i].textContent = ROTULOS[lerPerfil()];
    }
  });
})();
